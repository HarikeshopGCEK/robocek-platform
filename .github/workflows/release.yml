name: Build & Release ROBOCEK IDE

# Triggers when you push a tag like v0.1.0, v1.0.0, etc.
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-22.04
            label: Linux
          - os: macos-latest
            label: macOS

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: robocek-ide/package-lock.json

      # ── 3. Rust ──────────────────────────────────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: robocek-ide/src-tauri

      # ── 4. Linux system dependencies ─────────────────────────
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      # ── 5. Install Node dependencies ─────────────────────────
      - name: Install npm dependencies
        working-directory: robocek-ide
        run: npm ci

      # ── 6. Build & publish via tauri-action ──────────────────
      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: robocek-ide
          tagName: ${{ github.ref_name }}
          releaseName: 'ROBOCEK IDE ${{ github.ref_name }}'
          releaseBody: |
            ## ROBOCEK IDE ${{ github.ref_name }}

            Download the installer for your platform below.

            ### Windows
            - **ROBOCEK-IDE_x.x.x_x64-setup.exe** — NSIS installer (recommended)
            - **ROBOCEK-IDE_x.x.x_x64_en-US.msi** — MSI installer

            ### Linux
            - **robocek-ide_x.x.x_amd64.deb** — Debian/Ubuntu package
            - **robocek-ide_x.x.x_amd64.AppImage** — Portable, runs on any Linux distro

            ### macOS
            - **ROBOCEK-IDE_x.x.x_x64.dmg** — macOS disk image

            ### Prerequisites (all platforms)
            - [Python 3.10+](https://python.org)
            - [PlatformIO Core](https://docs.platformio.org/en/latest/core/installation/)
            - ROBOCEK CLI: clone the repo and run `pip install -e ./robocek-cli`
          releaseDraft: false
          prerelease: false
