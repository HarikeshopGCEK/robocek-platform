[package]
name = "robocek-ide"
version = "0.1.0"
description = "ROBOCEK Embedded Robotics IDE"
authors = ["you"]
edition = "2021"

[lib]
name = "robocek_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serialport = "4"

